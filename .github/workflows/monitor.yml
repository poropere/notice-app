name: 商品の発売チェック

on:
  # 監視は自宅の Mac（mac/notice.sh）で 5 分ごとに行っているため、GitHub の定期実行はしない。
  # ここは手動の確認（dry-run・テスト通知）と、runner: github の商品用に残している。
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        default: normal
        options:
          - normal
          - test-notification
          - dry-run
      test_url:
        description: "テスト通知をタップしたときに開く URL（任意。test-notification のときだけ使用）"
        type: string
        required: false
      runner:
        description: "dry-run で確認する商品（mac にすると Mac 担当の商品を GitHub から試す。Amazon は読めない）"
        type: choice
        default: github
        options:
          - github
          - mac

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 監視を実行
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          RAKUTEN_ENDPOINT: ${{ secrets.RAKUTEN_ENDPOINT }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          TEST_URL: ${{ github.event.inputs.test_url }}
          # 通常の実行では github 担当だけを確認する（Mac と同じ通知を二重に送らないため）
          MONITOR_RUNNER: ${{ github.event.inputs.mode == 'dry-run' && github.event.inputs.runner || 'github' }}
        run: |
          if [ "$MODE" = "test-notification" ]; then
            if [ -n "$TEST_URL" ]; then
              python monitor.py --test --url "$TEST_URL"
            else
              python monitor.py --test
            fi
          elif [ "$MODE" = "dry-run" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi

      - name: 状態ファイルを保存
        if: ${{ github.event.inputs.mode != 'test-notification' && github.event.inputs.mode != 'dry-run' }}
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state.json"
            # 実行中に products.yml が編集されても push できるよう、先に取り込む
            git pull --rebase
            git push
          fi
