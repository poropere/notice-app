name: 商品の発売チェック

on:
  schedule:
    # 5 分ごとに実行（GitHub の最短間隔。混雑で数分〜十数分遅れることがあります）
    # Amazon の商品は monitor.py 側で 30 分おきに間引いています
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        default: normal
        options:
          - normal
          - test-notification
          - dry-run
      test_url:
        description: "テスト通知をタップしたときに開く URL（任意。test-notification のときだけ使用）"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 監視を実行
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          RAKUTEN_ENDPOINT: ${{ secrets.RAKUTEN_ENDPOINT }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          TEST_URL: ${{ github.event.inputs.test_url }}
        run: |
          if [ "$MODE" = "test-notification" ]; then
            if [ -n "$TEST_URL" ]; then
              python monitor.py --test --url "$TEST_URL"
            else
              python monitor.py --test
            fi
          elif [ "$MODE" = "dry-run" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi

      - name: 状態ファイルを保存
        if: ${{ github.event.inputs.mode != 'test-notification' && github.event.inputs.mode != 'dry-run' }}
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state.json"
            # 実行中に products.yml が編集されても push できるよう、先に取り込む
            git pull --rebase
            git push
          fi
