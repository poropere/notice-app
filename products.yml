# 監視したい商品の一覧です。ここを編集して商品を追加・削除します。
# 編集したら GitHub に保存（コミット）するだけで、次回の監視から反映されます。
#
# ── 書き方は 3 種類 ──────────────────────────────────────
#
# 1) type: page
#    すでに商品ページがあるもの（予約開始前・在庫切れなど）を監視し、
#    「カートに入れる」などが表示されて購入できるようになったら通知します。
#      site: amazon / rakuten / custom
#      url:  商品ページの URL
#
# 2) type: rakuten_search
#    まだ商品ページがない発売予定品を、楽天の商品検索API で探し、
#    新しく出品されたら通知します（RAKUTEN_APP_ID の設定が必要）。
#      keyword:      検索キーワード（スペース区切りで AND 検索）
#      must_include: 商品名に必ず含まれるべき語（任意）
#      ng_keyword:   除外したい語（任意。中古、ケース など）
#      min_price / max_price: 価格の範囲（任意）
#
# 3) type: yahoo_search
#    Yahoo!ショッピングの商品検索API で探し、新しく出品されたら通知します
#    （YAHOO_APP_ID の設定が必要）。書き方は rakuten_search と同じで、さらに
#      preorder:  true にすると予約商品だけを対象にする（任意）
#      condition: new（既定・新品のみ） / used（中古のみ） / any（両方）
#
# type: page では open_url を付けると、通知をタップしたときに
# 監視している URL ではなく、その URL を開きます（アプリで開く URL など）。
#
# 確認間隔は 5 分おき（Amazon の商品ページだけは 30 分おき）です。
# 商品ごとに変えたいときは interval_minutes: 15 のように指定します（最短 5）。
#
# 一時的に止めたい商品は enabled: false を付けます。
#
# 監視はすべて自宅の Mac で行います（下の default_runner: mac）。
# 商品ごとに runner: github を付けると、その商品だけ GitHub が確認します。
# ────────────────────────────────────────────────

default_runner: mac

products:

  - name: 【Amazon】山崎12年
    type: page
    site: amazon
    url: https://www.amazon.co.jp/dp/B00384EZHE
    max_price: 18000   # 定価 17,600円。これを超える出品（転売価格）では通知しない
    runner: mac        # 自宅の Mac で確認する（GitHub からはボット対策で止められる。Mac からは読めた）

  - name: 【Yahoo】山崎12年      # 必須。通知のタイトルになる。重複不可
    type: yahoo_search                     # 必須
    keyword: 山崎 12年    # 必須。スペース区切りで AND 検索
    min_price: 16000                       # 3万円以上（アクセサリー類を除く）
    max_price: 18000                       # 8万円以下（転売の高額品を除く）
    interval_minutes: 10                   # 10分おきに確認（省略時は5分）

  - name: 【Yahoo】山崎18年      # 必須。通知のタイトルになる。重複不可
    type: yahoo_search                     # 必須
    keyword: 山崎 18年    # 必須。スペース区切りで AND 検索
    min_price: 60000                       # 3万円以上（アクセサリー類を除く）
    max_price: 69000                       # 8万円以下（転売の高額品を除く）
    interval_minutes: 10                   # 10分おきに確認（省略時は5分）

  - name: 【Yahoo】ユニアリ D.Gray-man      # 必須。通知のタイトルになる。重複不可
    type: yahoo_search                     # 必須
    keyword: ユニオンアリーナ D.Gray-man    # 必須。スペース区切りで AND 検索
    min_price: 3000                       # 3万円以上（アクセサリー類を除く）
    max_price: 5500                       # 8万円以下（転売の高額品を除く）

  # ── 山崎・白州：定価近くの出品を Yahoo!ショッピングで探す ──
  # 定価（2026年4月改定後・税込）: 山崎/白州 NV 8,250円、12年 17,600円

  - name: 【Yahoo】山崎 NV
    type: yahoo_search
    keyword: 山崎 700ml
    must_include: 山崎
    ng_keyword: 12年 18年 25年 白州 響 180ml 50ml ミニ 空瓶 グラス セット
    min_price: 7500
    max_price: 9500
    interval_minutes: 10

  - name: 【Yahoo】白州 NV
    type: yahoo_search
    keyword: 白州 700ml
    must_include: 白州
    ng_keyword: 12年 18年 25年 山崎 響 180ml 50ml ミニ 空瓶 グラス セット
    min_price: 7500
    max_price: 9500
    interval_minutes: 10

  - name: 【Yahoo】白州12年
    type: yahoo_search
    keyword: 白州 12年
    must_include: 白州 12年
    ng_keyword: 山崎 響 180ml 50ml ミニ 空瓶 グラス
    min_price: 16000
    max_price: 18500
    interval_minutes: 10

  # ── トレーディングカード（BOX を定価近くで探す） ──

  # ワンピースカードゲーム：ブースターパックの BOX（24パック入り）
  # 定価：OP-17 以降 1パック 240円 → 1BOX 5,760円（OP-16 までは 5,280円）
  - name: 【Yahoo】ワンピースカード ブースターパック BOX
    type: yahoo_search
    keyword: ワンピースカードゲーム ブースターパック BOX
    must_include: ブースターパック
    ng_keyword: スタートデッキ エクストラブースター プレミアムブースター スリーブ ストレージ ケース プレイマット ファイル 1パック バラ 中古 開封済み
    min_price: 5000
    max_price: 6500
    interval_minutes: 5

  # ポケモンカードゲーム MEGA 拡張パック「ハドウシーカー」（2026年11月27日発売・1BOX 30パック）
  # 定価は未確認（1パック 180円なら 1BOX 5,400円）
  - name: 【Yahoo】ポケカ ハドウシーカー BOX
    type: yahoo_search
    keyword: ポケモンカード ハドウシーカー BOX
    must_include: ハドウシーカー
    ng_keyword: スリーブ ケース デッキシールド プレイマット ファイル 1パック バラ 中古 開封済み シングル
    min_price: 4500
    max_price: 6500
    interval_minutes: 5

  # MTG「ノークティス：深淵の水府」Secret Lair Bundle 英語版（型番 D64330000）
  # 定価：税込 13,200円（本体 12,000円。カードショップBIGRED・CUBEの部屋の記事より）。日本語版はなし
  # 2027年2月5日発売（先行販売 1月29日〜）。通常のバンドルやブースターBOXは価格帯で除外
  - name: 【Yahoo】MTG ノークティス Secret Lair Bundle
    type: yahoo_search
    keyword: ノークティス 深淵の水府
    must_include: ノークティス
    ng_keyword: スリーブ デッキケース プレイマット ストレージ ファイル シングル 中古 開封済み
    min_price: 12000
    max_price: 15000
    interval_minutes: 5

  # ユニオンクリエイティブ公式通販：ToLOVEる ダークネス 水着シリーズ「金色の闇」1/4サイズ
  # 定価 39,600円（税込）、2026年11月21日発売。2026/11/24 時点「ただいま品切れ中です」
  # 「予約受付中」はメニューに、「SOLD OUT」はおすすめ欄に常に出るので判定に使わない。
  # 「お気に入り登録」は常に出る文字 → 品切れ表示が消えたら「購入可能」と判定させる。
  - name: 【ユニオン】ToLOVEる 金色の闇 水着 1/4
    type: page
    site: custom
    url: https://union-creative.jp/goods/detail/?id=1550
    available_keywords: ["お気に入り登録"]
    unavailable_keywords: ["ただいま品切れ中です", "販売終了", "受付終了"]
    message: 公式通販の品切れ表示が消えました（再販・在庫復活の可能性）。タップして商品ページを確認してください。

  # 同じ商品を Yahoo!ショッピングで定価帯の新着出品として探す
  # 定価 39,600円（税込・公式）。通販店では 37,000〜38,500円前後の出品あり（価格.com / Yahoo 2026/11 時点）
  # 他社の「金色の闇」1/4 フィギュア（バニー等）と区別するため「水着」を必須にする
  - name: 【Yahoo】ToLOVEる 金色の闇 水着 1/4
    type: yahoo_search
    keyword: 金色の闇 水着   # 「To LOVEる」「ToLOVEる」の表記ゆれがあるので作品名は入れない
    must_include: 金色の闇 水着
    ng_keyword: 中古 開封済み 箱傷み 台座のみ パーツ 交換用 ポスター タペストリー アクリル
    min_price: 35000
    max_price: 42000
    interval_minutes: 5

  # ── 山崎・白州：通販の抽選ページを見張る ──
  # ページに「山崎」か「白州」が載ったら（＝抽選・販売の受付が始まったら）通知します。

  - name: 【抽選】ビックカメラ.com 山崎・白州
    type: page
    site: custom
    url: https://www.biccamera.com/bc/c/sale/special/fukubako/index.html
    available_keywords: ["山崎", "白州"]
    interval_minutes: 30
    runner: mac      # 自宅の Mac で確認する
    enabled: false   # GitHub からも自宅の Mac からも応答がない（遮断されている）ため停止中

  - name: 【抽選】アピタ・ピアゴ 山崎・白州
    type: page
    site: custom
    url: https://online.apitashop.com/Form/Product/ProductList.aspx?cat=200220095
    available_keywords: ["山崎", "白州"]
    interval_minutes: 30
    message: 抽選販売のページに山崎・白州が載りました。応募期間を確認してください。

  - name: 【抽選】イトーヨーカドー 山崎・白州
    type: page
    site: custom
    url: https://iyec.itoyokado.co.jp/shop/e/eE4reslot/   # 受付中の予約・抽選の一覧
    available_keywords: ["山崎", "白州"]
    interval_minutes: 30
    message: 受付中の抽選一覧に山崎・白州が載りました。応募条件と期間を確認してください。

  - name: 【抽選】東急百貨店 山崎・白州
    type: page
    site: custom
    url: https://online.tokyu-dept.co.jp/cp/?fkey=lottery_sale
    available_keywords: ["山崎", "白州"]
    interval_minutes: 30
    enabled: false   # 受付中/終了の表示が JavaScript で切り替わるため、文字では判定できない

  # その他のサイトは site: custom で、判定に使う文言を自分で指定します。
  # - name: メーカー直販サイトの商品
  #   type: page
  #   site: custom
  #   url: https://example.com/products/123
  #   available_keywords: ["カートに入れる"]
  #   unavailable_keywords: ["SOLD OUT", "近日発売"]

  - name: 例）Amazonで予約開始を待っている商品
    type: page
    site: amazon
    url: https://www.amazon.co.jp/dp/XXXXXXXXXX
    max_price: 12000
    enabled: false   # URL を書き換えたらこの行を削除

  - name: 【Amazon】最大項目       # 必須。重複不可
    type: page                              # 省略可（省略時は page）
    site: amazon                            # 必須
    url: https://www.amazon.co.jp/dp/B0XXXXXXXX   # 必須。/dp/商品コード の短い形が確実
    open_url: https://www.amazon.co.jp/dp/B0XXXXXXXX?psc=1  # タップ時に開くURL（省略時は url）
    available_selectors:                    # この要素があれば「購入可能」
      - "#add-to-cart-button"
      - "#buy-now-button"
    available_keywords: ["予約注文する"]     # この文字があれば「購入可能」
    unavailable_keywords: ["現在お取り扱いできません"]  # この文字があれば「購入不可」（最優先）
    interval_minutes: 60                    # 60分おき（省略時は30分。30より短くもできる）
    max_price: 12000               # 12,000円以下のときだけ通知
    seller_keywords: Amazon.co.jp  # 販売元が Amazon.co.jp のときだけ（任意）
    enabled: false

  - name: 例）楽天の在庫切れ商品（この場合、予約可能、購入可能どっちも来る）
    type: page
    site: rakuten
    url: https://item.rakuten.co.jp/shop-name/item-code/
    enabled: false   # URL を書き換えたらこの行を削除

  - name: 例）Yahoo!ショッピングで発売予定品の出品を探す
    type: yahoo_search
    keyword: 商品名 型番
    ng_keyword: ケース フィルム
    enabled: false   # キーワードを書き換えたらこの行を削除

  - name: 【Yahoo】最大項目       # 必須。通知のタイトルになる。重複不可
    type: yahoo_search                     # 必須
    keyword: ゲーム機 新モデル 本体          # 必須。スペース区切りで AND 検索
    must_include: ["本体", "新モデル"]       # 商品名にすべて含まれるものだけ通知
    ng_keyword: 中古 ケース フィルム 互換     # 商品名に1つでも含まれたら除外
    min_price: 30000                       # 3万円以上（アクセサリー類を除く）
    max_price: 80000                       # 8万円以下（転売の高額品を除く）
    preorder: true                         # 予約商品だけを対象にする
    condition: new                         # new（既定）/ used / any
    interval_minutes: 10                   # 10分おきに確認（省略時は5分）
    enabled: false                          # false で一時停止（省略時は true）

  - name: 例）楽天で発売予定品の出品を探す
    type: rakuten_search
    keyword: 商品名 型番
    ng_keyword: 中古 ケース フィルム
    enabled: false   # キーワードを書き換えたらこの行を削除

  - name: 【楽天】最大項目
    type: rakuten_search
    keyword: ゲーム機 新モデル 本体
    must_include: 本体 新モデル              # スペース区切りでも書ける
    ng_keyword: ["中古", "ケース", "フィルム", "互換"]   # リスト形式でも書ける
    min_price: 30000
    max_price: 80000
    interval_minutes: 10
    enabled: false                         # 楽天APIが使えるようになるまで停止
